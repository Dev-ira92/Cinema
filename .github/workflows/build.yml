
name: Build CineHub for PS5

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            lld-18 \
            llvm-18 \
            llvm-18-dev \
            libclang-common-18-dev \
            curl \
            unzip \
            make \
            python3 \
            pkg-config \
            binutils

      - name: Download PS5 SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/ps5-toolchain"
          cd "$HOME/ps5-toolchain"

          curl -fL --retry 3 \
            -o sdk.zip \
            https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip

          mkdir -p sdk
          unzip -q sdk.zip -d sdk

          test -d sdk/ps5-payload-sdk

      - name: Download PacBrew libraries
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOME/ps5-toolchain"

          curl -fL --retry 3 \
            -o pacbrew.tar.gz \
            https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.41.1/ps5-payload-dev.tar.gz

          tar xzf pacbrew.tar.gz \
            --strip-components=2 \
            -C sdk/ps5-payload-sdk/

      - name: Configure PS5 toolchain
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/ps5-toolchain/sdk/ps5-payload-sdk"

          test -f "$SDK/toolchain/prospero.mk"

          echo "PS5_PAYLOAD_SDK=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/bin" >> "$GITHUB_PATH"

          echo "PS5 SDK configured."

      - name: Download source dependencies
        run: |
          set -e
          sh scripts/deps.sh

      - name: Check required libraries
        shell: bash
        run: |
          set -euo pipefail

          for pkg in \
            sdl2 \
            SDL2_net \
            libarchive \
            libwebp \
            libcurl \
            libxml-2.0 \
            libavformat \
            libavcodec \
            libswscale \
            libswresample \
            libavutil
          do
            prospero-pkg-config --exists "$pkg" || {
              echo "ERROR: Missing PS5 library: $pkg"
              exit 1
            }

            echo "$pkg: OK"
          done

      - name: Build CineHub
        shell: bash
        run: |
          set -euo pipefail

          make clean
          make -j2 2>&1 | tee build.log

          test -f cinehub.elf

          echo "CineHub ELF build completed."

      - name: Create homebrew package folder
        shell: bash
        run: |
          set -euo pipefail

          make package

          test -f package/PPSA85301/eboot.bin
          test -f package/PPSA85301/sce_sys/param.sfo
          test -f package/PPSA85301/sce_sys/icon0.png

          echo "Homebrew package folder created."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CineHub-PS5
          if-no-files-found: error
          path: |
            cinehub.elf
            movies.json
            build.log
            package/PPSA85301/
