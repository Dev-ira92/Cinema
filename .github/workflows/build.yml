name: Build CineHub

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 llvm-18-dev libclang-common-18-dev

      - name: Download PS5 SDK and libraries
        run: |
          mkdir -p $HOME/ps5-toolchain && cd $HOME/ps5-toolchain
          curl -sSL -o sdk.zip https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip
          curl -sSL -o pacbrew.tar.gz https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.40.2/ps5-payload-dev.tar.gz
          mkdir -p sdk && unzip -q sdk.zip -d sdk
          tar xzf pacbrew.tar.gz --strip-components=2 -C sdk/ps5-payload-sdk/

      - name: Remove the SDK's own FFmpeg (we link our build)
        run: |
          export PS5_PAYLOAD_SDK=$HOME/ps5-toolchain/sdk/ps5-payload-sdk
          echo "--- FFmpeg files shipped with the SDK (removing):"
          find "$PS5_PAYLOAD_SDK" \( -name 'libavcodec*' -o -name 'libavformat*' -o -name 'libavutil*' -o -name 'libswscale*' -o -name 'libswresample*' -o -name 'libavfilter*' -o -name 'libavdevice*' -o -name 'libpostproc*' \) | tee /tmp/ff-removed.txt
          xargs -r rm -rf < /tmp/ff-removed.txt
          echo "--- left after removal (must be empty):"
          find "$PS5_PAYLOAD_SDK" \( -name 'libavcodec*' -o -name 'libavformat*' -o -name 'libavutil*' -o -name 'libswscale*' -o -name 'libswresample*' \) | head

      - name: Fetch header-only deps
        run: sh scripts/deps.sh

      - name: Restore FFmpeg
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg-prefix
          key: ffmpeg-ps5-7.1.1-${{ hashFiles('scripts/build-ffmpeg.sh') }}
          fail-on-cache-miss: true

      - name: Build
        run: |
          export PS5_PAYLOAD_SDK=$HOME/ps5-toolchain/sdk/ps5-payload-sdk
          export PATH="$PS5_PAYLOAD_SDK/bin:$PATH"
          prospero-pkg-config --exists sdl2 && echo "sdl2 ok"
          make 2>&1 | tee build.log
          grep -E "undefined (reference|symbol)" build.log | sort -u | head -100 || true
          readelf -d cinehub.elf | grep -i kernel

      - uses: actions/upload-artifact@v4
        with:
          name: cinehub
          path: |
            cinehub.elf
            movies.json
